name: prosme
description: ProSME marketplace app for customers, artisans, and admins.
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_local_notifications: ^17.1.2
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.6.1
  google_mobile_ads: ^6.0.0
  intl: 0.20.2
  supabase_flutter: ^2.12.4
  uuid: ^4.4.0
  share_plus: ^10.0.2
  pdf: ^3.11.1
  printing: ^5.13.4
  shared_preferences: ^2.3.2
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  image: ^4.1.7
  geolocator: ^14.0.2
  country_state_city: ^0.1.6
  local_auth: ^2.3.0
  http: 1.2.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/prosme_logo.png

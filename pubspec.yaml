name: prosme
description: ProSME marketplace app for customers, artisans, and admins.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  supabase_flutter: ^2.9.1
  flutter_local_notifications: ^17.1.2
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.6.1
  intl: ^0.19.0
  uuid: ^4.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

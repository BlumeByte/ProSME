name: Production release check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate-supabase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: wbnvifrzckjttyxhmlcf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Credential preflight
        id: preflight
        shell: bash
        run: |
          reason="ok"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then reason="access-token-missing"; fi
          if [ "$reason" = "ok" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then reason="db-password-missing"; fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          [ "$reason" = "ok" ] || exit 1
      - name: Link ProSME production project
        if: steps.preflight.outcome == 'success'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        if: steps.preflight.outcome == 'success'
        run: supabase db push --dry-run
      - name: Apply pending migrations
        if: steps.preflight.outcome == 'success'
        run: supabase db push
      - name: Publish Supabase migration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const reason = '${{ steps.preflight.outputs.reason }}';
            const ok = '${{ job.status }}' === 'success';
            const contextName = ok
              ? 'Supabase Migration'
              : `Supabase Migration - ${reason && reason !== 'ok' ? reason : 'link-or-push-failed'}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: contextName,
              description: ok ? 'Production migrations applied successfully' : 'Production migration needs attention'
            })

  smoke-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Allow Vercel production deployment to settle
        run: sleep 90
      - name: Verify live home, login and Flutter web app
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://prosme.blumebyte.com"
          for route in "/" "/app/" "/login"; do
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 30 "$base$route" -o "/tmp/$(echo "$route" | tr '/' '_' | sed 's/^_$/home/').html"
          done
          grep -qi "ProSME" /tmp/home.html
          grep -Eq "flutter|flutter_bootstrap|main.dart.js" /tmp/_app_.html
          grep -q "/app/#/auth" /tmp/_login.html
          total=$(curl -sS -o /dev/null -w '%{time_total}' "$base/")
          python3 - <<PY
          total=float('$total')
          print(f'Production homepage response: {total:.3f}s')
          if total > 5.0:
              raise SystemExit('Homepage response exceeded 5 seconds')
          PY
      - name: Publish production smoke status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'Production Smoke',
              description: ok ? 'Live home, login and Flutter web app passed' : 'Live route or performance verification failed'
            })

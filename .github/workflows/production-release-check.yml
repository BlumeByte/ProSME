name: Production release check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate-supabase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: wbnvifrzckjttyxhmlcf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify production Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 1; }
      - name: Link ProSME production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push

  smoke-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for production deployment and verify public site
        shell: bash
        run: |
          set -euo pipefail
          base="https://prosme.blumebyte.com"
          for attempt in $(seq 1 30); do
            if curl -fsSL --connect-timeout 10 --max-time 30 "$base" -o /tmp/home.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production site did not become reachable"
              exit 1
            fi
            sleep 10
          done
          grep -qi "ProSME" /tmp/home.html

      - name: Verify shared Flutter web app is deployed
        shell: bash
        run: |
          set -euo pipefail
          base="https://prosme.blumebyte.com"
          curl -fsSL --retry 5 --retry-delay 5 "$base/app/" -o /tmp/app.html
          grep -Eq "flutter|flutter_bootstrap|main.dart.js" /tmp/app.html
          curl -fsSL --retry 5 --retry-delay 5 "$base/login" -o /tmp/login.html
          grep -q "/app/#/auth" /tmp/login.html

      - name: Basic response-time check
        shell: bash
        run: |
          set -euo pipefail
          total=$(curl -sS -o /dev/null -w '%{time_total}' https://prosme.blumebyte.com/)
          python3 - <<PY
          total=float('$total')
          print(f'Production homepage response: {total:.3f}s')
          if total > 5.0:
              raise SystemExit('Homepage response exceeded 5 seconds')
          PY

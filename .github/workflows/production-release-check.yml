name: Production release check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate-supabase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: wbnvifrzckjttyxhmlcf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Credential preflight
        id: preflight
        shell: bash
        run: |
          reason="ok"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then reason="access-token-missing"; fi
          if [ "$reason" = "ok" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then reason="db-password-missing"; fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          [ "$reason" = "ok" ] || exit 1
      - name: Link ProSME production project
        if: steps.preflight.outcome == 'success'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        if: steps.preflight.outcome == 'success'
        run: supabase db push --dry-run
      - name: Apply pending migrations
        if: steps.preflight.outcome == 'success'
        run: supabase db push
      - name: Publish Supabase migration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const reason = '${{ steps.preflight.outputs.reason }}';
            const ok = '${{ job.status }}' === 'success';
            const contextName = ok ? 'Supabase Migration' : `Supabase Migration - ${reason && reason !== 'ok' ? reason : 'link-or-push-failed'}`;
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: ok ? 'success' : 'failure', context: contextName, description: ok ? 'Production migrations applied successfully' : 'Production migration needs attention'});

  smoke-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Allow Vercel production deployment to settle
        run: sleep 60
      - name: Probe production routes and Flutter files
        id: probe
        shell: bash
        run: |
          set +e
          base="https://prosme.blumebyte.com"
          home=fail; app=fail; index=fail; bootstrap=fail; login=fail; perf=fail

          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$base/" -o /tmp/home.html
          if [ $? -eq 0 ] && grep -qi "ProSME" /tmp/home.html; then home=ok; fi

          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$base/app/" -o /tmp/app.html
          if [ $? -eq 0 ] && grep -Eq "flutter|flutter_bootstrap|main.dart.js" /tmp/app.html; then app=ok; fi

          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$base/app/index.html" -o /tmp/app_index.html
          if [ $? -eq 0 ] && grep -Eq "flutter|flutter_bootstrap|main.dart.js" /tmp/app_index.html; then index=ok; fi

          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$base/app/flutter_bootstrap.js" -o /tmp/flutter_bootstrap.js
          if [ $? -eq 0 ] && grep -Eq "flutter|FlutterLoader|_flutter" /tmp/flutter_bootstrap.js; then bootstrap=ok; fi

          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$base/login" -o /tmp/login.html
          if [ $? -eq 0 ] && grep -q "/app/#/auth" /tmp/login.html; then login=ok; fi

          total=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{time_total}' "$base/" 2>/dev/null)
          python3 - <<PY
          try: total=float('${total:-999}')
          except Exception: total=999
          print(f'Production homepage response: {total:.3f}s')
          raise SystemExit(0 if total <= 5.0 else 1)
          PY
          if [ $? -eq 0 ]; then perf=ok; fi

          echo "home=$home" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
          echo "login=$login" >> "$GITHUB_OUTPUT"
          echo "perf=$perf" >> "$GITHUB_OUTPUT"

          if [ "$home" != ok ] || [ "$app" != ok ] || [ "$index" != ok ] || [ "$bootstrap" != ok ] || [ "$login" != ok ] || [ "$perf" != ok ]; then exit 1; fi
      - name: Publish detailed production statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const checks = [
              ['Production Home', '${{ steps.probe.outputs.home }}'],
              ['Production Flutter App', '${{ steps.probe.outputs.app }}'],
              ['Production Flutter Index', '${{ steps.probe.outputs.index }}'],
              ['Production Flutter Bootstrap', '${{ steps.probe.outputs.bootstrap }}'],
              ['Production Login Route', '${{ steps.probe.outputs.login }}'],
              ['Production Performance', '${{ steps.probe.outputs.perf }}'],
            ];
            for (const [contextName, result] of checks) {
              await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: result === 'ok' ? 'success' : 'failure', context: contextName, description: result === 'ok' ? 'Verified in production' : 'Production verification failed'});
            }
